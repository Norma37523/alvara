<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Norma Contábil – Gestão de alvarás (protótipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F5F7FA; --card:#FFFFFF; --card2:#ECF0F4; --ink:#101028; --body:#363D4D; --muted:#6B7488; --line:#DDE2EB; --line2:#C4CCD9;
  --accent:#0FA79F; --accent-solid:#1EE7D6; --on-accent:#101028;
  --side:#101028; --side-line:#313468;
  --ok-fg:#0B7A53; --ok-bg:#D6F5E8; --warn-fg:#9A6208; --warn-bg:#FDF0D4; --bad-fg:#B42A3C; --bad-bg:#FBDBE0; --info-fg:#2563C8; --info-bg:#D9E7FB;
  --pend-fg:#4A5468; --pend-bg:#E6EAF0;
  --shadow:0 1px 2px rgba(16,16,40,.06),0 6px 20px rgba(16,16,40,.06);
  --focus:#2563C8;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101028; --card:#18193A; --card2:#23254F; --ink:#FFFFFF; --body:#C9CEDB; --muted:#9AA4B6; --line:#2A2C5C; --line2:#313468;
    --accent:#1EE7D6; --side:#0B0B1F; --side-line:#23254F;
    --ok-fg:#3FD6A0; --ok-bg:rgba(15,157,107,.2); --warn-fg:#F3B24A; --warn-bg:rgba(200,130,14,.2); --bad-fg:#F27A8B; --bad-bg:rgba(210,59,78,.22); --info-fg:#7FAEF7; --info-bg:rgba(37,99,200,.25);
    --pend-fg:#B7C0D0; --pend-bg:rgba(154,164,182,.16);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --focus:#7FAEF7;
  }
}
:root[data-theme="dark"]{
  --bg:#101028; --card:#18193A; --card2:#23254F; --ink:#FFFFFF; --body:#C9CEDB; --muted:#9AA4B6; --line:#2A2C5C; --line2:#313468;
  --accent:#1EE7D6; --side:#0B0B1F; --side-line:#23254F;
  --ok-fg:#3FD6A0; --ok-bg:rgba(15,157,107,.2); --warn-fg:#F3B24A; --warn-bg:rgba(200,130,14,.2); --bad-fg:#F27A8B; --bad-bg:rgba(210,59,78,.22); --info-fg:#7FAEF7; --info-bg:rgba(37,99,200,.25);
  --pend-fg:#B7C0D0; --pend-bg:rgba(154,164,182,.16);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --focus:#7FAEF7;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--body);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:Poppins,"DM Sans",system-ui,sans-serif;color:var(--ink);margin:0;letter-spacing:-.01em}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}

/* barra lateral (sempre navy, marca) */
.side{background:var(--side);color:#fff;padding:22px 14px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px;border-right:1px solid var(--side-line)}
.brand img{display:block;height:30px;width:auto;margin:0 6px}
.brand small{display:block;margin:10px 8px 0;color:#9AA4B6;font-size:12.5px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;background:none;border:0;color:#C9CEDB;padding:10px 12px;border-radius:10px;cursor:pointer;text-align:left;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.07)}
.nav button[aria-current="page"]{background:#23254F;color:#fff;box-shadow:inset 3px 0 0 #1EE7D6}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .cnt{margin-left:auto;background:#D23B4E;color:#fff;border-radius:999px;font-size:11.5px;font-weight:700;padding:1px 8px}
.nav .sep{margin:12px 12px 4px;font-size:11.5px;color:#7F89A0}
.side .foot{margin-top:auto;font-size:12px;color:#7F89A0;padding:0 8px}

/* principal */
.main{padding:22px 32px 56px;min-width:0}
.bar{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between;margin-bottom:22px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sel{background:var(--card);border:1px solid var(--line2);border-radius:999px;padding:8px 14px;min-height:40px;max-width:280px}
.sel:disabled{opacity:.65;cursor:not-allowed}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;background:var(--card2);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;cursor:pointer;font-size:13.5px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.iconbtn{border:1px solid var(--line2);background:var(--card);border-radius:999px;width:40px;height:40px;cursor:pointer;display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.user{font-size:13px;color:var(--muted);text-align:right;line-height:1.3}
.user b{color:var(--ink);display:block;font-size:13.5px}
.proto{background:var(--info-bg);color:var(--info-fg);border-radius:10px;padding:8px 14px;font-size:13px;margin-bottom:20px}

h1.title{font-size:clamp(1.5rem,2.6vw,2.1rem);font-weight:700;line-height:1.2}
.sub{color:var(--muted);margin:4px 0 20px}

.alert{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-radius:14px;padding:14px 18px;margin-bottom:18px;border:1px solid}
.alert.bad{background:var(--bad-bg);color:var(--bad-fg);border-color:var(--bad-fg)}
.alert.warn{background:var(--warn-bg);color:var(--warn-fg);border-color:var(--warn-fg)}
.alert.good{background:var(--ok-bg);color:var(--ok-fg);border-color:var(--ok-fg)}
.alert strong{display:block;font-size:15.5px}
.alert span{font-size:13.5px;opacity:.92}
.btn{border:0;border-radius:999px;padding:9px 18px;min-height:40px;cursor:pointer;font-weight:700;font-size:14px}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.accent{background:var(--accent-solid);color:var(--on-accent)}
.btn.accent:hover{box-shadow:0 0 0 4px rgba(30,231,214,.25)}
.btn.sec{background:transparent;border:1px solid var(--line2);color:var(--ink)}
.alert .btn{background:var(--ink);color:var(--bg)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
.tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;box-shadow:var(--shadow);overflow:hidden}
.tile::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(150deg,#14E6E6,#2DF6C6)}
.tile.bad::before{background:#D23B4E}.tile.warn::before{background:#C8820E}.tile.mute::before{background:var(--line2)}
.tile .l{font-size:13px;color:var(--muted)}
.tile .v{font-family:Poppins,sans-serif;font-weight:700;font-size:36px;line-height:1.15;color:var(--ink);margin:4px 0 2px}
.tile .n{font-size:12.5px;color:var(--muted)}

.cols>*{min-width:0}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px 20px}
.card h2{font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:10px}
.card h2 button{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;font-size:13px}
.card .hint{font-size:12.5px;color:var(--muted);margin:2px 0 12px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list .t{font-weight:600;color:var(--ink);line-height:1.3}
.list .s{font-size:12.5px;color:var(--muted);line-height:1.35}
.list .go{background:none;border:0;cursor:pointer;text-align:left;flex:1;padding:0;min-width:0}
.empty{color:var(--muted);padding:18px 0;text-align:center}

.badge{display:inline-block;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:700;white-space:nowrap}
.badge.venc{background:var(--bad-bg);color:var(--bad-fg)}
.badge.d30,.badge.d60,.badge.warn{background:var(--warn-bg);color:var(--warn-fg)}
.badge.ok{background:var(--ok-bg);color:var(--ok-fg)}
.badge.pend,.badge.neutro{background:var(--pend-bg);color:var(--pend-fg)}
.badge.info{background:var(--info-bg);color:var(--info-fg)}

/* documentos */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.search{flex:1;min-width:220px;background:var(--card);border:1px solid var(--line2);border-radius:999px;padding:9px 16px;min-height:40px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{border:1px solid var(--line2);background:var(--card);padding:6px 14px;border-radius:999px;cursor:pointer;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
.tbl{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:820px}
th{background:var(--accent-solid);color:#101028;text-align:left;font-size:12.5px;padding:11px 14px;font-weight:700}
th:first-child{border-top-left-radius:13px}th:last-child{border-top-right-radius:13px}
td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:var(--card2)}
td .emp{font-weight:600;color:var(--ink);line-height:1.3}
td .uni{font-size:12.5px;color:var(--muted)}
.act{display:flex;gap:6px;justify-content:flex-end}
.act button{border:1px solid var(--line2);background:transparent;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink)}
.act button:hover{background:var(--card2)}

/* renovações */
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.bucket h2 .c{font-family:Poppins,sans-serif;font-size:26px;color:var(--ink)}
.bucket.bad{border-top:3px solid #D23B4E}.bucket.warn{border-top:3px solid #C8820E}.bucket.ok{border-top:3px solid #0F9D6B}.bucket.mute{border-top:3px solid var(--line2)}
.bucket .list .t{font-size:14px}

/* notificações */
.feed li{align-items:flex-start}
.ico{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:800;font-size:15px}
.ico.bad{background:var(--bad-bg);color:var(--bad-fg)}.ico.warn{background:var(--warn-bg);color:var(--warn-fg)}.ico.info{background:var(--info-bg);color:var(--info-fg)}
.marcos{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}
.marcos span{background:var(--card2);border-radius:999px;padding:5px 14px;font-weight:700;color:var(--ink);font-size:13.5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;color:var(--ink);font-weight:500}

/* painel lateral de detalhe */
.scrim{position:fixed;inset:0;background:rgba(10,10,30,.55);z-index:30;display:none}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--card);z-index:31;transform:translateX(102%);transition:transform .22s ease;padding:calc(22px + env(safe-area-inset-top,0px)) 24px calc(22px + env(safe-area-inset-bottom,0px));overflow-y:auto;box-shadow:-10px 0 40px rgba(0,0,0,.3)}
.drawer.on{transform:none}
.drawer h2{font-size:19px;line-height:1.3;margin:10px 0 4px}
.drawer .close{float:right;background:var(--card2);border:0;border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:18px;color:var(--ink)}
.drawer dl{display:grid;gap:12px;margin:18px 0}
.drawer dt{font-size:12px;color:var(--muted)}
.drawer dd{margin:0;color:var(--ink);font-weight:500;word-break:break-word}
.drawer .obs{background:var(--card2);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--body)}
.drawer .btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:999px;z-index:40;opacity:0;pointer-events:none;transition:.2s;max-width:92vw;font-size:14px;font-weight:500;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.view[hidden]{display:none}

@media (max-width:980px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{min-width:0}
  .sel{max-width:100%}
  .filters{width:100%}
  .filters .sel{flex:1;min-width:0}
  .side{position:static;height:auto;flex-direction:column;gap:10px;padding:14px 14px 10px}
  .brand small,.side .foot,.nav .sep{display:none}
  .nav{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .nav button{white-space:nowrap}
  .nav button[aria-current="page"]{box-shadow:inset 0 -3px 0 #1EE7D6}
  .main{padding:18px 16px 48px}
  .cols{grid-template-columns:minmax(0,1fr)!important}
  .user{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const SNAP = "06/10/2026";
const MS = 86400000;
const hoje0 = (()=>{const d=new Date();d.setHours(0,0,0,0);return d;})();
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = iso => iso ? iso.split("-").reverse().join("/") : "—";
const toDate = iso => {const [y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d);};
const TIPO = {lf:"Alvará de localização e funcionamento", bombeiros:"Alvará de Bombeiros (CLCB/AVCB)"};
const TIPO_CURTO = {lf:"Alvará de funcionamento", bombeiros:"Alvará de Bombeiros"};
const cut=(s,n)=>s.length>n?s.slice(0,n).replace(/\s+\S*$/,"")+"…":s;
const plural=(n,s,p)=>n+" "+(n===1?s:p);

DATA.forEach((it,i)=>{
  it.id=i;
  it.dias = it.validade ? Math.round((toDate(it.validade)-hoje0)/MS) : null;
  if(it.dias!==null) it.cls = it.dias<0?"venc":it.dias<=30?"d30":it.dias<=60?"d60":"ok";
  else if(/prazo indeterminado|Dispensad/i.test(it.sit)) it.cls="neutro";
  else it.cls="pend";
  it.score = it.dias!==null ? it.dias : (it.cls==="pend"?400:5000);
  it.acao = ["venc","d30","d60","pend"].includes(it.cls);
  it.nome = it.empresa+(it.unidade?" ("+it.unidade+")":"");
  const m=/^(PENDENTE|URGENTE|REEMITIR)\s*:\s*/.exec(it.obs||"");
  it.flag = m?m[1]:"";
  it.obsTxt = (it.obs||"").replace(/^(PENDENTE|URGENTE|REEMITIR)\s*:\s*/,"");
});
const EMPRESAS=[...new Set(DATA.map(i=>i.empresa))];

/* ---------- estado ---------- */
const S={view:"dashboard",emp:"",uni:"",visao:"norma",docF:"todos",q:"",tipo:""};
const CLIENTE_PADRAO="INP – Instituto Negócios Públicos do Brasil";
const sel=()=>DATA.filter(i=>(!S.emp||i.empresa===S.emp)&&(!S.uni||i.unidade===S.uni));
const label=it=>it.cls==="venc"?"Vencido":(it.dias!==null&&it.cls!=="ok")?"Vence em "+it.dias+" d":it.cls==="ok"?"Em dia":it.cls==="neutro"?(/Dispensad/i.test(it.sit)?"Dispensado":"Prazo indeterminado"):/Aguardando AVCB/i.test(it.sit)?"Aguardando AVCB":/Aguardando/i.test(it.sit)?"Aguardando alteração":/Verificando/i.test(it.sit)?"Verificando":"Sem data";
const badge=it=>'<span class="badge '+it.cls+'">'+esc(label(it))+'</span>';
const isCli=()=>S.visao==="cliente";
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),3200);}

const NAV=[["dashboard","Dashboard"],["documentos","Documentos"],["renovacoes","Renovações"],["notificacoes","Notificações"]];
function renderNav(){
  const n=sel(); const alertas=n.filter(i=>i.cls==="venc"||i.cls==="d30").length;
  let h=NAV.map(([k,l])=>'<button type="button" data-v="'+k+'"'+(S.view===k?' aria-current="page"':'')+'>'+ICON[k]+'<span>'+l+'</span>'+(k==="notificacoes"&&alertas?'<span class="cnt">'+alertas+'</span>':'')+'</button>').join("");
  if(!isCli()) h+='<div class="sep">Somente equipe Norma</div><button type="button" data-v="admin"'+(S.view==="admin"?' aria-current="page"':'')+'>'+ICON.admin+'<span>Administração</span></button>';
  $("#nav").innerHTML=h;
  $("#nav").querySelectorAll("button").forEach(b=>b.onclick=()=>go(b.dataset.v));
}
function go(v){ if(v==="admin"&&isCli()) v="dashboard"; S.view=v; if(location.hash!=="#"+v) history.pushState(null,"","#"+v); render(); window.scrollTo({top:0}); }
window.addEventListener("popstate",()=>{const v=location.hash.slice(1); if(["dashboard","documentos","renovacoes","notificacoes","admin"].includes(v)){S.view=(v==="admin"&&isCli())?"dashboard":v;render();}});

/* ---------- filtros do topo ---------- */
function renderFilters(){
  const e=$("#selEmp"), u=$("#selUni");
  e.innerHTML=(isCli()?"":'<option value="">Todas as empresas</option>')+EMPRESAS.map(x=>'<option'+(x===S.emp?" selected":"")+' value="'+esc(x)+'">'+esc(x)+'</option>').join("");
  e.value=S.emp; e.disabled=isCli();
  const unis=[...new Set(DATA.filter(i=>!S.emp||i.empresa===S.emp).map(i=>i.unidade||"matriz única"))];
  const showU = !!S.emp && unis.length>1;
  u.hidden=!showU;
  u.innerHTML='<option value="">Todas as unidades</option>'+unis.map(x=>{const v=x==="matriz única"?"":x; return '<option value="'+esc(v)+'">'+esc(x)+'</option>';}).join("");
  u.value=S.uni;
  $("#user").innerHTML=isCli()?'<b>gestor@inp.com.br</b>Perfil: gestor da empresa':'<b>equipe@normacontabil.com</b>Perfil: administrador Norma';
  $("#vNorma").setAttribute("aria-pressed",String(!isCli())); $("#vCli").setAttribute("aria-pressed",String(isCli()));
  $("#proto").innerHTML=isCli()
   ? '<b>Visão cliente (simulada):</b> o login enxerga só a própria empresa, sem observações internas, responsável interno nem a área de administração.'
   : 'Protótipo navegável com os 33 registros reais da planilha de '+SNAP+'. Download, login e conexão com o Drive são simulados.';
}
$("#selEmp").onchange=e=>{S.emp=e.target.value;S.uni="";render();};
$("#selUni").onchange=e=>{S.uni=e.target.value;render();};
$("#vNorma").onclick=()=>{S.visao="norma";render();};
$("#vCli").onclick=()=>{S.visao="cliente"; if(!S.emp){S.emp=CLIENTE_PADRAO;S.uni="";} if(S.view==="admin")S.view="dashboard"; render();};
$("#theme").onclick=()=>{
  const r=document.documentElement; const dark=matchMedia("(prefers-color-scheme: dark)").matches;
  const cur=r.getAttribute("data-theme")||(dark?"dark":"light");
  r.setAttribute("data-theme",cur==="dark"?"light":"dark");
};

/* ---------- dashboard ---------- */
function vDashboard(){
  const n=sel(); const c=k=>n.filter(i=>i.cls===k).length;
  const venc=c("venc"), d30=c("d30"), venc60=c("d30")+c("d60"), ok=c("ok"), pend=c("pend"), neutro=c("neutro");
  const prox=[...n.filter(i=>i.dias!==null&&i.dias<=90)].sort((a,b)=>a.dias-b.dias);
  const dem=n.filter(i=>i.flag||/Aguardando|Verificando/i.test(i.sit)||i.cls==="venc").sort((a,b)=>a.score-b.score);
  const nome=S.emp||"Carteira de clientes";
  let alerta;
  if(venc||d30){
    const p=[]; if(venc)p.push(plural(venc,"documento vencido","documentos vencidos")); if(d30)p.push(plural(d30,"vence","vencem")+" em até 30 dias");
    alerta='<div class="alert bad"><div><strong>'+esc(p.join(" e "))+'</strong><span>Regularize para evitar multas e restrições de funcionamento.</span></div><button class="btn" id="goAcao" type="button">Ver documentos</button></div>';
  } else alerta='<div class="alert good"><div><strong>Nenhum documento vencido ou vencendo em 30 dias.</strong><span>Continue acompanhando as pendências abaixo.</span></div></div>';
  const regulares=ok+neutro;
  return '<h1 class="title">'+(isCli()?"Olá, "+esc(nome)+".":esc(nome))+'</h1><p class="sub">Resumo dos documentos e demandas'+(S.uni?" · "+esc(S.uni):"")+'</p>'+alerta+
  '<div class="tiles">'+
   '<div class="tile"><div class="l">Documentos em dia</div><div class="v">'+ok+'</div><div class="n">'+Math.round(regulares/Math.max(n.length,1)*100)+'% regulares (em dia ou sem prazo)</div></div>'+
   '<div class="tile warn"><div class="l">Vencendo em 60 dias</div><div class="v">'+venc60+'</div><div class="n">'+(d30?plural(d30,"em até 30 dias","em até 30 dias"):"nenhum em até 30 dias")+'</div></div>'+
   '<div class="tile bad"><div class="l">Documentos vencidos</div><div class="v">'+venc+'</div><div class="n">'+(venc?"ação urgente necessária":"nenhum vencido")+'</div></div>'+
   '<div class="tile mute"><div class="l">Sem data de validade</div><div class="v">'+(pend+neutro)+'</div><div class="n">'+pend+' pendentes · '+neutro+' sem prazo definido</div></div>'+
  '</div>'+
  '<div class="cols">'+
   '<div class="card"><h2>Próximas renovações<button type="button" data-go="renovacoes">Ver todas</button></h2><p class="hint">Vencidos e vencimentos nos próximos 90 dias</p>'+
     (prox.length?'<ul class="list">'+prox.slice(0,6).map(i=>'<li><button class="go" type="button" data-open="'+i.id+'"><div class="t">'+esc(TIPO_CURTO[i.tipo])+'</div><div class="s">'+esc(i.nome)+' · '+fmt(i.validade)+'</div></button>'+badge(i)+'</li>').join("")+'</ul>':'<div class="empty">Nenhuma renovação nos próximos 90 dias.</div>')+'</div>'+
   '<div class="card"><h2>Demandas e pendências<button type="button" data-go="documentos">Ver todas</button></h2><p class="hint">'+plural(dem.length,"item em acompanhamento","itens em acompanhamento")+'</p>'+
     (dem.length?'<ul class="list">'+dem.slice(0,6).map(i=>'<li><button class="go" type="button" data-open="'+i.id+'"><div class="t">'+esc(TIPO_CURTO[i.tipo])+' · '+esc(i.nome)+'</div><div class="s">'+esc(cut(isCli()?"":i.obsTxt,120)||label(i))+'</div></button>'+badge(i)+'</li>').join("")+'</ul>':'<div class="empty">Nenhuma pendência.</div>')+'</div>'+
  '</div>';
}

/* ---------- documentos ---------- */
const FILTROS=[["todos","Todos"],["acao","Exigem ação"],["venc","Vencidos"],["ok","Em dia"],["pend","Pendentes"]];
const passa=(i,f)=>f==="todos"||(f==="acao"?i.acao:i.cls===f);
function vDocumentos(){
  const base=sel();
  const q=S.q.trim().toLowerCase();
  const rows=base.filter(i=>passa(i,S.docF)&&(!S.tipo||i.tipo===S.tipo)&&(!q||(i.nome+" "+i.doc+" "+i.orgao+" "+TIPO[i.tipo]).toLowerCase().includes(q))).sort((a,b)=>a.score-b.score);
  return '<h1 class="title">Documentos</h1><p class="sub">Alvarás e licenças organizados e sempre atualizados</p>'+
  '<div class="toolbar"><input class="search" id="q" type="search" placeholder="Buscar por empresa, número ou órgão" value="'+esc(S.q)+'" aria-label="Buscar documentos">'+
  '<select class="sel" id="tipoSel" aria-label="Tipo de licença"><option value="">Todos os tipos</option><option value="lf"'+(S.tipo==="lf"?" selected":"")+'>Alvará de funcionamento</option><option value="bombeiros"'+(S.tipo==="bombeiros"?" selected":"")+'>Alvará de Bombeiros</option></select></div>'+
  '<div class="chips" role="group" aria-label="Filtrar por situação">'+FILTROS.map(([k,l])=>'<button type="button" class="chip" data-f="'+k+'" aria-pressed="'+(S.docF===k)+'">'+l+' ('+base.filter(i=>passa(i,k)).length+')</button>').join("")+'</div>'+
  '<div class="tbl"><table><thead><tr><th>Empresa</th><th>Documento</th><th>Nº / protocolo</th><th>Órgão</th><th>Validade</th><th>Situação</th><th></th></tr></thead><tbody>'+
  (rows.length?rows.map(i=>'<tr><td><div class="emp">'+esc(i.empresa)+'</div><div class="uni">'+esc(i.unidade||"matriz única")+'</div></td><td>'+esc(TIPO_CURTO[i.tipo])+'</td><td>'+esc(i.doc||"—")+'</td><td>'+esc(i.orgao||"—")+'</td><td>'+fmt(i.validade)+'</td><td>'+badge(i)+'</td><td><div class="act"><button type="button" data-open="'+i.id+'">Ver</button><button type="button" data-dl="'+i.id+'">Baixar</button></div></td></tr>').join(""):'<tr><td colspan="7" class="empty">Nenhum documento neste filtro.</td></tr>')+
  '</tbody></table></div>';
}

/* ---------- renovações ---------- */
function vRenovacoes(){
  const n=sel(); const d=n.filter(i=>i.dias!==null);
  const B=[["Vencidos","bad",i=>i.dias<0],["Até 30 dias","warn",i=>i.dias>=0&&i.dias<=30],["31 a 60 dias","warn",i=>i.dias>30&&i.dias<=60],["61 a 90 dias","ok",i=>i.dias>60&&i.dias<=90],["91 a 180 dias","ok",i=>i.dias>90&&i.dias<=180],["181 a 365 dias","ok",i=>i.dias>180&&i.dias<=365],["Mais de 1 ano","ok",i=>i.dias>365]];
  const card=(t,k,items,semData)=>'<div class="card bucket '+k+'"><h2>'+esc(t)+'<span class="c">'+items.length+'</span></h2>'+
    (items.length?'<ul class="list">'+items.map(i=>'<li><button class="go" type="button" data-open="'+i.id+'"><div class="t">'+esc(TIPO_CURTO[i.tipo])+'</div><div class="s">'+esc(i.nome)+(semData?"":" · "+fmt(i.validade))+'</div></button>'+(semData?badge(i):'<span class="badge '+i.cls+'">'+(i.dias<0?Math.abs(i.dias)+" d atrás":i.dias+" d")+'</span>')+'</li>').join("")+'</ul>':'<div class="empty">—</div>')+'</div>';
  return '<h1 class="title">Renovações</h1><p class="sub">Vencimentos organizados por prazo, do mais urgente ao mais distante</p><div class="buckets">'+
    B.map(([t,k,f])=>card(t,k,d.filter(f).sort((a,b)=>a.dias-b.dias),false)).join("")+
    card("Sem data de validade","mute",n.filter(i=>i.dias===null&&i.cls==="pend"),true)+'</div>';
}

/* ---------- notificações ---------- */
function vNotificacoes(){
  const n=sel(); const L=[];
  n.forEach(i=>{
    if(i.cls==="venc") L.push({lv:"bad",o:0+i.dias/1e4,t:"Documento vencido",x:TIPO_CURTO[i.tipo]+" de "+i.nome+" venceu há "+Math.abs(i.dias)+" dias ("+fmt(i.validade)+").",i});
    else if(i.dias!==null&&i.dias<=30) L.push({lv:"warn",o:1+i.dias/1e4,t:"Vence em "+i.dias+(i.dias===1?" dia":" dias"),x:TIPO_CURTO[i.tipo]+" de "+i.nome+" vence em "+fmt(i.validade)+".",i});
    else if(i.dias!==null&&i.dias<=90) L.push({lv:"info",o:3+i.dias/1e4,t:"Renovação em "+i.dias+" dias",x:TIPO_CURTO[i.tipo]+" de "+i.nome+" vence em "+fmt(i.validade)+".",i});
    if(i.flag&&!isCli()) L.push({lv:"warn",o:2,t:i.flag==="REEMITIR"?"Reemissão necessária":i.flag==="URGENTE"?"Pendência urgente":"Pendência de regularização",x:i.nome+": "+cut(i.obsTxt,150),i});
    else if(i.cls==="pend"&&!i.flag) L.push({lv:"info",o:4,t:"Sem data de validade",x:TIPO_CURTO[i.tipo]+" de "+i.nome+" sem data cadastrada.",i});
  });
  L.sort((a,b)=>a.o-b.o);
  const ic={bad:"!",warn:"!",info:"i"};
  return '<h1 class="title">Notificações</h1><p class="sub">O que o sistema avisaria hoje</p><div class="cols" style="grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)">'+
  '<div class="card"><h2>Avisos de hoje</h2><p class="hint">'+plural(L.length,"aviso","avisos")+'</p>'+
  (L.length?'<ul class="list feed">'+L.slice(0,30).map(a=>'<li><span class="ico '+a.lv+'">'+ic[a.lv]+'</span><button class="go" type="button" data-open="'+a.i.id+'"><div class="t">'+esc(a.t)+'</div><div class="s">'+esc(a.x)+'</div></button></li>').join("")+'</ul>':'<div class="empty">Nenhum aviso.</div>')+'</div>'+
  '<div class="card"><h2>Regras de aviso</h2><p class="hint">Disparos automáticos antes do vencimento (dias)</p><div class="marcos"><span>90</span><span>60</span><span>30</span><span>15</span><span>7</span><span>3</span><span>1</span><span>0</span></div>'+
  '<dl class="kv"><dt>Vencidos</dt><dd>repete a cada 7 dias</dd><dt>E-mail</dt><dd>ativo (exemplo)</dd><dt>WhatsApp</dt><dd>planejado</dd><dt>Resumo semanal</dd><dd>segunda-feira, 8h</dd></dl></div></div>';
}

/* ---------- administração (exemplo) ---------- */
function vAdmin(){
  const pastas=EMPRESAS.map(e=>{const n=DATA.filter(i=>i.empresa===e).length;return '<tr><td>'+esc(e)+'</td><td>Clientes / '+esc(e.split(" – ")[0])+' / Societário / Alvarás</td><td>'+n+'</td></tr>';}).join("");
  return '<h1 class="title">Administração</h1><p class="sub">Como a área da Norma ficará na fase 2 (dados de exemplo)</p>'+
  '<div class="card" style="margin-bottom:14px"><h2>Integração com o Google Drive <span class="badge ok">Conectado (exemplo)</span></h2><p class="hint">Uma pasta por cliente; o sistema lista os arquivos e libera o download só depois de conferir o login.</p>'+
   '<div class="tbl" style="box-shadow:none"><table style="min-width:560px"><thead><tr><th>Cliente</th><th>Pasta monitorada</th><th>Licenças</th></tr></thead><tbody>'+pastas+'</tbody></table></div></div>'+
  '<div class="cols" style="grid-template-columns:1fr 1fr"><div class="card"><h2>Usuários e perfis</h2><p class="hint">Cada cliente enxerga apenas a própria empresa</p><ul class="list">'+
   '<li><div><div class="t">equipe@normacontabil.com</div><div class="s">Todas as empresas</div></div><span class="badge info">Administrador</span></li>'+
   '<li><div><div class="t">gestor@inp.com.br</div><div class="s">INP</div></div><span class="badge ok">Gestor</span></li>'+
   '<li><div><div class="t">financeiro@inp.com.br</div><div class="s">INP · só consulta</div></div><span class="badge pend">Leitor</span></li></ul></div>'+
  '<div class="card"><h2>Trilha de acessos</h2><p class="hint">Quem viu e baixou cada documento</p><ul class="list">'+
   '<li><div><div class="t">gestor@inp.com.br baixou um documento</div><div class="s">Alvará de Bombeiros · INP (matriz)</div></div><span class="s">hoje 09:12</span></li>'+
   '<li><div><div class="t">financeiro@inp.com.br consultou o painel</div><div class="s">INP</div></div><span class="s">hoje 08:40</span></li>'+
   '<li><div><div class="t">equipe@normacontabil.com atualizou uma data</div><div class="s">INFOCO-RH (matriz)</div></div><span class="s">ontem 17:05</span></li></ul></div></div>';
}

/* ---------- detalhe ---------- */
let lastFocus=null;
function openDoc(id){
  const it=DATA[id]; lastFocus=document.activeElement;
  const r=[]; const add=(t,v)=>{ if(v) r.push('<div><dt>'+t+'</dt><dd>'+esc(v)+'</dd></div>'); };
  add("Empresa",it.nome); add("CNPJ",it.cnpj); add("Município",it.mun); add("Órgão emissor",it.orgao); add("Nº do documento",it.doc);
  add("Data de emissão",it.emissao?fmt(it.emissao):""); add("Data de validade",it.validade?fmt(it.validade):"não informada");
  if(!isCli()){ add("Situação registrada",it.sit); add("Responsável interno",it.resp); }
  const obs=(!isCli()&&it.obs)?'<div class="obs"><dt style="margin-bottom:4px">Observações internas</dt>'+esc(it.obs)+'</div>':"";
  $("#drawer").innerHTML='<button class="close" type="button" id="dClose" aria-label="Fechar">×</button>'+badge(it)+'<h2 id="dTitle">'+esc(TIPO[it.tipo])+'</h2><div style="color:var(--muted)">'+esc(it.nome)+'</div><dl>'+r.join("")+'</dl>'+obs+
   '<div class="btns"><button class="btn accent" type="button" id="dDl">Baixar documento</button><button class="btn sec" type="button" id="dDrive">Abrir no Drive</button></div>';
  $("#scrim").classList.add("on"); $("#drawer").classList.add("on"); $("#drawer").setAttribute("aria-hidden","false");
  $("#dClose").focus(); $("#dClose").onclick=closeDoc;
  $("#dDl").onclick=()=>toast("Simulação: no sistema real, o arquivo é baixado do Drive após conferir o login.");
  $("#dDrive").onclick=()=>toast("Simulação: o link do Drive só abre para a equipe Norma.");
  if(isCli()) $("#dDrive").hidden=true;
}
function closeDoc(){ $("#scrim").classList.remove("on"); $("#drawer").classList.remove("on"); $("#drawer").setAttribute("aria-hidden","true"); if(lastFocus&&lastFocus.focus) lastFocus.focus(); }
$("#scrim").onclick=closeDoc;
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeDoc(); });

/* ---------- render ---------- */
function bind(root){
  root.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openDoc(+b.dataset.open));
  root.querySelectorAll("[data-dl]").forEach(b=>b.onclick=()=>toast("Simulação: no sistema real, o arquivo é baixado do Drive após conferir o login."));
  root.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
}
function render(){
  renderFilters(); renderNav();
  const V={dashboard:vDashboard,documentos:vDocumentos,renovacoes:vRenovacoes,notificacoes:vNotificacoes,admin:vAdmin};
  document.querySelectorAll(".view").forEach(s=>{s.hidden=s.id!=="v-"+S.view; if(s.hidden) s.innerHTML="";});
  const root=$("#v-"+S.view); root.innerHTML=V[S.view](); bind(root);
  if(S.view==="dashboard"){ const g=$("#goAcao"); if(g) g.onclick=()=>{S.docF="acao";go("documentos");}; }
  if(S.view==="documentos"){
    root.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{S.docF=b.dataset.f;render();});
    $("#tipoSel").onchange=e=>{S.tipo=e.target.value;render();};
    const q=$("#q"); q.oninput=e=>{S.q=e.target.value; const p=q.selectionStart; render(); const q2=$("#q"); q2.focus(); q2.setSelectionRange(p,p);};
  }
}
const h0=location.hash.slice(1); if(["dashboard","documentos","renovacoes","notificacoes"].includes(h0)) S.view=h0;
render();
</script>
</body>
